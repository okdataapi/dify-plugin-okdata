name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Unit tests (mocked HTTP, no network)
        run: python -m pytest -q --cov=okdata_api --cov=provider --cov=tools --cov-fail-under=80
      - name: Package with the Dify plugin CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R langgenius/dify-plugin-daemon --pattern dify-plugin-linux-amd64 --dir "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/dify-plugin-linux-amd64"
          version=$(grep '^version:' manifest.yaml | awk '{print $2}')
          cd .. && "$RUNNER_TEMP/dify-plugin-linux-amd64" plugin package "$GITHUB_WORKSPACE" -o "$RUNNER_TEMP/okdata-$version.difypkg"
          unzip -l "$RUNNER_TEMP/okdata-$version.difypkg"
