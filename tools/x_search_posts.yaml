identity:
  name: x_search_posts
  author: okdata
  label:
    en_US: X (Twitter) Post Search
    zh_Hans: X（推特）帖子搜索
description:
  human:
    en_US: 'Search X (Twitter) posts; X search operators such as lang:, from: and min_faves: work. Latest or top, about 20 posts per call.'
    zh_Hans: '搜 X（推特）帖子，支持 lang:、from:、min_faves: 等 X 搜索语法，可按最新或热门。每次调用约 20 条。'
  llm: Search X (Twitter) posts. The query supports X search operators (from:user, lang:en, min_faves:100, quotes for exact phrases). Returns about 20 posts per page with text, author, published_at and metrics. Billed per call.
parameters:
- name: query
  type: string
  required: true
  form: llm
  label:
    en_US: Keywords
    zh_Hans: 关键词
  human_description:
    en_US: Search words; X operators work, e.g. "claude code" lang:en.
    zh_Hans: 搜索词，支持 X 搜索语法，如 "claude code" lang:zh。
  llm_description: 'The X search query; operators like from:, lang:, min_faves: and quoted phrases work.'
  placeholder:
    en_US: '"claude code" lang:en'
    zh_Hans: '"claude code" lang:zh'
- name: sort
  type: select
  required: false
  form: llm
  default: latest
  label:
    en_US: Order
    zh_Hans: 排序
  human_description:
    en_US: Result order.
    zh_Hans: 结果排序。
  llm_description: latest (default) or top.
  options:
  - value: latest
    label:
      en_US: Latest
      zh_Hans: 最新
  - value: top
    label:
      en_US: Top
      zh_Hans: 热门
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor (next page)
    zh_Hans: 翻页 cursor
  human_description:
    en_US: Leave empty for the first page. For the next page, pass next_cursor from the previous result. Each page is a separate, separately billed call.
    zh_Hans: 第一页留空。要下一页时，填上一次结果里的 next_cursor。每翻一页都是一次单独计费的调用。
  llm_description: 'Leave empty for the first page. Only for the next page: pass next_cursor from the previous result of this tool with the same inputs. Each page is billed as a separate call.'
- name: max_price
  type: number
  required: false
  form: form
  default: 0.01
  min: 0.0001
  max: 100
  label:
    en_US: Max price per call (USD)
    zh_Hans: 单次调用最高价格（美元）
  human_description:
    en_US: okdata refuses any call that could cost more than this before it runs, and bills nothing for it. Raise it if an endpoint's price goes up.
    zh_Hans: 可能超过这个价格的调用会在执行前被拒绝，不扣钱。接口涨价时调高这个值。
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
      description: The results on this page
    next_cursor:
      type: string
      description: Pass as cursor to get the next page; empty when there is none
    has_more:
      type: boolean
      description: Whether another page exists
    cost:
      type: string
      description: What this call cost, in US dollars
    balance_after:
      type: string
      description: okdata balance left after this call, in US dollars
    request_id:
      type: string
      description: okdata request ID, for support
    result_status:
      type: string
      description: complete, partial or empty
extra:
  python:
    source: tools/x_search_posts.py
