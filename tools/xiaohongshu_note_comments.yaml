identity:
  name: xiaohongshu_note_comments
  author: okdata
  label:
    en_US: RedNote (Xiaohongshu) Note Comments
    zh_Hans: 小红书笔记评论
description:
  human:
    en_US: Comments on a RedNote (Xiaohongshu) note, with likes, reply counts and the commenter's IP location. About 10 comments per call.
    zh_Hans: 小红书笔记下的评论，带点赞数、回复数和 IP 属地。每次调用约 10 条。
  llm: List comments on a Xiaohongshu (RedNote) note. Input the note id (24 hex characters) or a xiaohongshu.com/explore/... link. Returns about 10 comments per page with text, author, likes, replies, ip_location. Billed per call.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Note ID or link
    zh_Hans: 笔记 ID 或链接
  human_description:
    en_US: The note ID from note search, or a xiaohongshu.com/explore/... link.
    zh_Hans: 笔记搜索结果里的 ID，或 xiaohongshu.com/explore/... 链接。
  llm_description: The Xiaohongshu note id (24 hex characters, from note search results) or a xiaohongshu.com/explore/<id> link.
  placeholder:
    en_US: 6650a1b2000000001e00abcd
    zh_Hans: 6650a1b2000000001e00abcd
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor (next page)
    zh_Hans: 翻页 cursor
  human_description:
    en_US: Leave empty for the first page. For the next page, pass next_cursor from the previous result. Each page is a separate, separately billed call.
    zh_Hans: 第一页留空。要下一页时，填上一次结果里的 next_cursor。每翻一页都是一次单独计费的调用。
  llm_description: 'Leave empty for the first page. Only for the next page: pass next_cursor from the previous result of this tool with the same inputs. Each page is billed as a separate call.'
- name: max_price
  type: number
  required: false
  form: form
  default: 0.05
  min: 0.0001
  max: 100
  label:
    en_US: Max price per call (USD)
    zh_Hans: 单次调用最高价格（美元）
  human_description:
    en_US: okdata refuses any call that could cost more than this before it runs, and bills nothing for it. Raise it if an endpoint's price goes up.
    zh_Hans: 可能超过这个价格的调用会在执行前被拒绝，不扣钱。接口涨价时调高这个值。
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
      description: The results on this page
    next_cursor:
      type: string
      description: Pass as cursor to get the next page; empty when there is none
    has_more:
      type: boolean
      description: Whether another page exists
    cost:
      type: string
      description: What this call cost, in US dollars
    balance_after:
      type: string
      description: okdata balance left after this call, in US dollars
    request_id:
      type: string
      description: okdata request ID, for support
    result_status:
      type: string
      description: complete, partial or empty
extra:
  python:
    source: tools/xiaohongshu_note_comments.py
