identity:
  name: xiaohongshu_search_notes
  author: okdata
  label:
    en_US: RedNote (Xiaohongshu) Note Search
    zh_Hans: 小红书笔记搜索
description:
  human:
    en_US: Search RedNote (Xiaohongshu) notes by keywords, newest or most popular first, with images, likes, saves and the author. About 20 notes per call.
    zh_Hans: 按关键词搜小红书笔记，可按最新或最热，带图片、点赞、收藏和作者。每次调用约 20 条。
  llm: Search Xiaohongshu (RedNote) notes by keywords; Chinese keywords work best. Returns about 20 notes per page with id, url, title, text, author, images and metrics (likes, comments, favorites). Use the note id with the note comments tool. Billed per call.
parameters:
- name: query
  type: string
  required: true
  form: llm
  label:
    en_US: Keywords
    zh_Hans: 关键词
  human_description:
    en_US: Search words, as typed into the Xiaohongshu search box. Chinese keywords give the best results.
    zh_Hans: 搜索词，和在小红书搜索框里输入的一样。
  llm_description: Keywords to search Xiaohongshu for, usually in Chinese, e.g. 防晒霜 推荐.
  placeholder:
    en_US: sunscreen
    zh_Hans: 防晒霜 推荐
- name: sort
  type: select
  required: false
  form: llm
  default: general
  label:
    en_US: Order
    zh_Hans: 排序
  human_description:
    en_US: Result order.
    zh_Hans: 结果排序。
  llm_description: general (default), latest or popular.
  options:
  - value: general
    label:
      en_US: Most relevant
      zh_Hans: 综合
  - value: latest
    label:
      en_US: Newest
      zh_Hans: 最新
  - value: popular
    label:
      en_US: Most popular
      zh_Hans: 最热
- name: type
  type: select
  required: false
  form: llm
  default: all
  label:
    en_US: Note type
    zh_Hans: 笔记类型
  human_description:
    en_US: All notes, or only video or image notes.
    zh_Hans: 全部，或只要视频笔记或图文笔记。
  llm_description: all (default), video or image.
  options:
  - value: all
    label:
      en_US: All
      zh_Hans: 全部
  - value: video
    label:
      en_US: Video notes
      zh_Hans: 视频笔记
  - value: image
    label:
      en_US: Image notes
      zh_Hans: 图文笔记
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor (next page)
    zh_Hans: 翻页 cursor
  human_description:
    en_US: Leave empty for the first page. For the next page, pass next_cursor from the previous result. Each page is a separate, separately billed call.
    zh_Hans: 第一页留空。要下一页时，填上一次结果里的 next_cursor。每翻一页都是一次单独计费的调用。
  llm_description: 'Leave empty for the first page. Only for the next page: pass next_cursor from the previous result of this tool with the same inputs. Each page is billed as a separate call.'
- name: max_price
  type: number
  required: false
  form: form
  default: 0.05
  min: 0.0001
  max: 100
  label:
    en_US: Max price per call (USD)
    zh_Hans: 单次调用最高价格（美元）
  human_description:
    en_US: okdata refuses any call that could cost more than this before it runs, and bills nothing for it. Raise it if an endpoint's price goes up.
    zh_Hans: 可能超过这个价格的调用会在执行前被拒绝，不扣钱。接口涨价时调高这个值。
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
      description: The results on this page
    next_cursor:
      type: string
      description: Pass as cursor to get the next page; empty when there is none
    has_more:
      type: boolean
      description: Whether another page exists
    cost:
      type: string
      description: What this call cost, in US dollars
    balance_after:
      type: string
      description: okdata balance left after this call, in US dollars
    request_id:
      type: string
      description: okdata request ID, for support
    result_status:
      type: string
      description: complete, partial or empty
extra:
  python:
    source: tools/xiaohongshu_search_notes.py
