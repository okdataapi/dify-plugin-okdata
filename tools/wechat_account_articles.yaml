identity:
  name: wechat_account_articles
  author: okdata
  label:
    en_US: WeChat Official Account Articles
    zh_Hans: 公众号历史文章
description:
  human:
    en_US: An Official Account's published articles, newest first, with links. No QR login. About 10 per call.
    zh_Hans: 公众号已发布的文章，从新到旧，带链接，不用扫码登录。每次调用约 10 篇。
  llm: List a WeChat Official Account's published articles, newest first. Input the account's WeChat ID or original ID (gh_...). Returns about 10 articles per page with title, url and published_at. Billed per call.
parameters:
- name: id
  type: string
  required: true
  form: llm
  label:
    en_US: Account WeChat ID or original ID
    zh_Hans: 公众号微信号或原始 ID
  human_description:
    en_US: The account's WeChat ID, or its original ID starting with gh_.
    zh_Hans: 公众号的微信号，或 gh_ 开头的原始 ID。
  llm_description: The Official Account's WeChat ID or its original ID (gh_...).
  placeholder:
    en_US: gh_363b924965e9
    zh_Hans: gh_363b924965e9
- name: tab
  type: select
  required: false
  form: llm
  default: articles
  label:
    en_US: Tab
    zh_Hans: 栏目
  human_description:
    en_US: Which tab of the account's page.
    zh_Hans: 公众号主页的哪一栏。
  llm_description: articles (default), videos or images.
  options:
  - value: articles
    label:
      en_US: Articles
      zh_Hans: 文章
  - value: videos
    label:
      en_US: Videos
      zh_Hans: 视频
  - value: images
    label:
      en_US: Pictures
      zh_Hans: 贴图
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Cursor (next page)
    zh_Hans: 翻页 cursor
  human_description:
    en_US: Leave empty for the first page. For the next page, pass next_cursor from the previous result. Each page is a separate, separately billed call.
    zh_Hans: 第一页留空。要下一页时，填上一次结果里的 next_cursor。每翻一页都是一次单独计费的调用。
  llm_description: 'Leave empty for the first page. Only for the next page: pass next_cursor from the previous result of this tool with the same inputs. Each page is billed as a separate call.'
- name: max_price
  type: number
  required: false
  form: form
  default: 0.05
  min: 0.0001
  max: 100
  label:
    en_US: Max price per call (USD)
    zh_Hans: 单次调用最高价格（美元）
  human_description:
    en_US: okdata refuses any call that could cost more than this before it runs, and bills nothing for it. Raise it if an endpoint's price goes up.
    zh_Hans: 可能超过这个价格的调用会在执行前被拒绝，不扣钱。接口涨价时调高这个值。
output_schema:
  type: object
  properties:
    items:
      type: array
      items:
        type: object
      description: The results on this page
    next_cursor:
      type: string
      description: Pass as cursor to get the next page; empty when there is none
    has_more:
      type: boolean
      description: Whether another page exists
    cost:
      type: string
      description: What this call cost, in US dollars
    balance_after:
      type: string
      description: okdata balance left after this call, in US dollars
    request_id:
      type: string
      description: okdata request ID, for support
    result_status:
      type: string
      description: complete, partial or empty
extra:
  python:
    source: tools/wechat_account_articles.py
